name: 更新台股收盤價

on:
  schedule:
    # 台股 13:30 收盤 = UTC 05:30。GitHub 排程常被延後，故收盤後每小時各跑一次，
    # 直到晚上，確保當天收盤價會更新（有變動才 commit，不會洗版）。
    # UTC 06~13 時 = 台灣時間 14:00~21:00，只在週一~週五。
    - cron: '0 6-13 * * 1-5'
  workflow_dispatch: {}   # 也可以在 GitHub 網頁手動按一下立即更新

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 抓收盤價
        run: node scripts/fetch-prices.js
      - name: 有變動才 commit
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "更新收盤價 $(TZ=Asia/Taipei date +%F)"
          git push
