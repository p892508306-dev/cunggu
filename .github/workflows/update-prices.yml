name: 更新台股收盤價

on:
  schedule:
    # UTC 08:00 = 台灣時間 16:00（下午 4 點），只在週一~週五跑
    - cron: '0 8 * * 1-5'
  workflow_dispatch: {}   # 也可以在 GitHub 網頁手動按一下立即更新

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 抓收盤價
        run: node scripts/fetch-prices.js
      - name: 有變動才 commit
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "更新收盤價 $(TZ=Asia/Taipei date +%F)"
          git push
